# nginx do host da VPS: /etc/nginx/sites-available/geraguia.com.br
# Primeira vez:
#   ln -s /etc/nginx/sites-available/geraguia.com.br /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d geraguia.com.br -d www.geraguia.com.br --redirect
# O certbot acrescenta o bloco 443 e o redirecionamento do http.

server {
    server_name geraguia.com.br www.geraguia.com.br;
    # Endereço único para o Google: www vai para o domínio sem www.
    if ($host = www.geraguia.com.br) { return 301 https://geraguia.com.br$request_uri; }

    access_log /var/log/nginx/geraguia_access.log;
    error_log /var/log/nginx/geraguia_error.log;

    # Só JSON e formulários; o XML da NF-e é lido no navegador.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Emissão de guia: o gdare espera a SEFIN/SEFAZ, pode passar de 2 minutos.
    location ~ ^/api/(dare|fethab/dar)$ {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Analytics (Umami, em /opt/umami): pelo site passam só o script e a coleta.
    # O painel não fica exposto aqui.
    location = /u/script.js {
        proxy_pass http://127.0.0.1:3070/script.js;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /u/api/send {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3070/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        # O rate limit do site usa o X-Real-IP; o valor vem só do nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    listen 80;
    listen [::]:80;
}
