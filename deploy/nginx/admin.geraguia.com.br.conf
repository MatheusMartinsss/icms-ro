# nginx do host da VPS: /etc/nginx/sites-available/admin.geraguia.com.br
# Painel do Umami (analytics do GeraGuia, /opt/umami).
# Primeira vez:
#   ln -s /etc/nginx/sites-available/admin.geraguia.com.br /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d admin.geraguia.com.br --redirect

# Login: no máximo 5 tentativas por minuto por IP.
limit_req_zone $binary_remote_addr zone=umami_login:1m rate=5r/m;

server {
    server_name admin.geraguia.com.br;

    access_log /var/log/nginx/admin-geraguia_access.log;
    error_log /var/log/nginx/admin-geraguia_error.log;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/auth/login {
        limit_req zone=umami_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
